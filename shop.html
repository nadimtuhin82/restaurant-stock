<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping List</title>
<meta name="theme-color" content="#1565c0">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --ok: #2e7d32; --mod: #f9a825; --low: #ef6c00; --out: #c62828; --accent: #1565c0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #f5f5f5; color: #222; font-size: 18px; }
  header { background: var(--accent); color: white; padding: 12px 16px; }
  header h1 { margin: 0; font-size: 1.3rem; }
  #updated { font-size: .85rem; opacity: .9; }
  main { padding: 12px; max-width: 600px; margin: 0 auto; }
  h2 { font-size: 1rem; color: #666; margin: 18px 0 8px; }
  /* Each item is a big tappable row, easy to hit with a thumb in a shop */
  label.item { display: flex; align-items: center; gap: 12px; background: white; border-radius: 10px;
               padding: 14px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1);
               border-left: 6px solid var(--low); cursor: pointer; }
  label.item.o { border-left-color: var(--out); }
  label.item.m { border-left-color: var(--mod); }
  label.item input { width: 28px; height: 28px; flex-shrink: 0; }
  .name { font-weight: bold; }
  .details { color: #666; font-size: .85rem; }
  /* Ticked items: greyed out and crossed through */
  label.item.done { opacity: .5; }
  label.item.done .name { text-decoration: line-through; }
  #progress { font-weight: bold; margin: 4px 0 0; }
  button { padding: 12px 16px; border-radius: 8px; border: 1px solid #ccc; background: white;
           font-size: 1rem; margin-top: 16px; width: 100%; }
  .empty { background: white; padding: 16px; border-radius: 10px; }
</style>
</head>
<body>
<header>
  <h1>🛒 Shopping List</h1>
  <div id="updated"></div>
</header>
<main>
  <p id="progress"></p>
  <div id="list"></div>
  <button id="clearBtn">Untick everything</button>
</main>

<script>
// ------------------------------------------------------------------
// Where the list comes from:
// 1. Every alert from the tablet has the list packed into a link. Tapping
//    "Open shopping list" opens this page with that link, and the page
//    learns the ntfy topic from it.
// 2. After that, this page asks ntfy for the newest list by itself every
//    time it's opened, and listens live while it's open. So you can open it
//    from your home screen and it's up to date.
// The list is saved on this phone, so it's still here without internet.
// ------------------------------------------------------------------
const LIST_KEY = "shoppingList.latest";
const TICKS_KEY = "shoppingList.ticked";   // names of items already bought
const TOPIC_KEY = "shoppingList.topic";    // learned from the first alert you tap

const LABEL = { o: "OUT", l: "LOW", m: "MODERATE" };

// Turns the packed text from the address back into a list.
// Every item becomes [name, status code, category].
function unpackList(text) {
  if (text.startsWith("v2*")) {
    // Packed format – see shoppingLink() in index.html for how it's built
    const [, time, categoryText, itemText, leftOut, topic] = text.split("*");
    const categories = categoryText ? categoryText.split("!") : [];
    const items = (itemText ? itemText.split("~") : [])
      .filter(part => part.length > 2)
      .map(part => [part.slice(2), part[0], categories[parseInt(part[1], 36)] || "Other"]);
    return { t: parseInt(time, 36), items, leftOut: parseInt(leftOut || "0", 10), topic };
  }
  // Older alerts sent the list as JSON
  return JSON.parse(text);
}

function readListFromAddress() {
  if (location.hash.length < 2) return;
  try {
    // Always show exactly the list from the alert you tapped. (We used to
    // compare times, but a device with its clock set wrong could make a
    // new list look "old" and get ignored.)
    const incoming = unpackList(decodeURIComponent(location.hash.slice(1)));
    localStorage.setItem(LIST_KEY, JSON.stringify(incoming));
    if (incoming.topic) localStorage.setItem(TOPIC_KEY, incoming.topic);
  } catch (error) {
    console.warn("Couldn't read the list from the address", error);
    alert("Sorry, this alert's list couldn't be read. Ask the tablet to send the list again.");
  }
  // Remove the list from the address bar, so a home-screen shortcut or a
  // refresh shows the saved (latest) list instead of this exact one
  history.replaceState(null, "", location.pathname);
}

function getTicked() {
  return JSON.parse(localStorage.getItem(TICKS_KEY) || "[]");
}

function setTicked(names) {
  localStorage.setItem(TICKS_KEY, JSON.stringify(names));
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = String(text);
  // Also escape quote marks, because names go inside data-name="..."
  return div.innerHTML.replace(/"/g, "&quot;");
}

function render() {
  const saved = JSON.parse(localStorage.getItem(LIST_KEY) || "null");
  const container = document.getElementById("list");

  if (!saved || saved.items.length === 0) {
    document.getElementById("updated").textContent = "";
    document.getElementById("progress").textContent = "";
    container.innerHTML = saved
      ? `<p class="empty">✅ Nothing to buy – everything is stocked.</p>`
      : `<p class="empty">No list yet. Tap a stock alert in the ntfy app on this phone to load the list.</p>`;
    return;
  }

  // Prefer ntfy's own clock (serverTime, in seconds) over the tablet's,
  // in case the tablet's clock is set wrong
  const when = saved.serverTime ? saved.serverTime * 1000 : saved.t;
  document.getElementById("updated").textContent =
    "List from " + new Date(when).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) +
    " · " + connectionStatus;

  // Keep only ticks for items that are still on the list
  const names = saved.items.map(item => item[0]);
  const ticked = getTicked().filter(name => names.includes(name));
  setTicked(ticked);

  // Each item is [name, status code, category]. Alerts from the older
  // version were [name, code, count, unit, category], so the category is
  // always the LAST entry – that way both kinds still work.
  const categoryOf = item => item[item.length - 1];
  const row = item => {
    const [name, code] = item;
    return `
    <label class="item ${code} ${ticked.includes(name) ? "done" : ""}">
      <input type="checkbox" data-name="${escapeHtml(name)}" ${ticked.includes(name) ? "checked" : ""}>
      <span>
        <span class="name">${escapeHtml(name)}</span><br>
        <span class="details">${LABEL[code]} · ${escapeHtml(categoryOf(item))}</span>
      </span>
    </label>`;
  };

  // Sort by category so items from the same area are together
  const byCategory = (a, b) => categoryOf(a).localeCompare(categoryOf(b)) || a[0].localeCompare(b[0]);
  const needToBuy = saved.items.filter(i => i[1] !== "m").sort(byCategory);
  const moderate = saved.items.filter(i => i[1] === "m").sort(byCategory);

  let html = "";
  if (needToBuy.length) html += "<h2>Need to buy</h2>" + needToBuy.map(row).join("");
  if (moderate.length) html += "<h2>Moderate – still have some</h2>" + moderate.map(row).join("");
  // If the list was too long to fit in one alert, say so
  if (saved.leftOut > 0) {
    html += `<p class="empty">⚠️ ${saved.leftOut} more item(s) didn't fit in this alert – check the tablet's Reorder list.</p>`;
  }
  container.innerHTML = html;

  document.getElementById("progress").textContent = `Got ${ticked.length} of ${saved.items.length}`;
}

// Tapping a tick box saves it straight away, so closing the page is safe
document.getElementById("list").addEventListener("change", event => {
  const name = event.target.dataset.name;
  if (!name) return;
  const ticked = getTicked().filter(n => n !== name);
  if (event.target.checked) ticked.push(name);
  setTicked(ticked);
  render();
});

document.getElementById("clearBtn").addEventListener("click", () => {
  if (confirm("Untick every item?")) { setTicked([]); render(); }
});

// If the page is already open and you tap another alert, load the new list
window.addEventListener("hashchange", () => { readListFromAddress(); render(); startLive(); });

// ------------------------------------------------------------------
// Getting new lists straight from ntfy
// ------------------------------------------------------------------
let connectionStatus = "not connected yet";
let liveConnection = null;

// An ntfy message holds the list link in its button (or its tap link).
// If it has a list newer than ours, save and show it. Returns true if the
// message had a list in it.
function useMessage(message) {
  const links = [...(message.actions || []).map(a => a.url), message.click];
  const link = links.find(url => url && url.includes("#"));
  if (!link) return false;
  try {
    const list = unpackList(decodeURIComponent(link.split("#")[1]));
    list.serverTime = message.time;   // when ntfy received it (reliable clock)
    const saved = JSON.parse(localStorage.getItem(LIST_KEY) || "null");
    // Skip it if we already have this list or a newer one from ntfy
    if (saved && saved.serverTime && saved.serverTime >= message.time) return true;
    localStorage.setItem(LIST_KEY, JSON.stringify(list));
    render();
    return true;
  } catch (error) {
    return false;   // not a list we can read (e.g. a very old alert) – ignore it
  }
}

// Ask ntfy for the recent messages on our topic (it keeps them ~12 hours)
// and use the newest one that has a list.
async function fetchLatest() {
  const topic = localStorage.getItem(TOPIC_KEY);
  if (!topic) return;
  try {
    const response = await fetch(`https://ntfy.sh/${encodeURIComponent(topic)}/json?poll=1&since=all`);
    const lines = (await response.text()).trim().split("\n").filter(Boolean);
    const messages = lines.map(line => JSON.parse(line)).filter(m => m.event === "message");
    for (let i = messages.length - 1; i >= 0; i--) {
      if (useMessage(messages[i])) break;   // newest first; stop at the first list
    }
    connectionStatus = "🟢 up to date";
  } catch (error) {
    connectionStatus = "⚪ offline – showing saved list";
  }
  render();
}

// While the page is open, keep a live connection to ntfy (EventSource is a
// built-in browser tool for this). New lists appear within seconds.
function startLive() {
  const topic = localStorage.getItem(TOPIC_KEY);
  if (!topic || liveConnection) return;
  liveConnection = new EventSource(`https://ntfy.sh/${encodeURIComponent(topic)}/sse`);
  liveConnection.onmessage = event => {
    const message = JSON.parse(event.data);
    if (message.event === "message") useMessage(message);
  };
  liveConnection.onopen = () => { connectionStatus = "🟢 live"; render(); };
  liveConnection.onerror = () => { connectionStatus = "⚪ reconnecting…"; render(); };
}

// Phones pause pages in the background, so check again when you come back
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") fetchLatest();
});

readListFromAddress();
render();
fetchLatest().then(startLive);
</script>
</body>
</html>
